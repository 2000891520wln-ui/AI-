<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 灵感手帐设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>AI 灵感手帐设置</h1>
      <label>
        API 地址
        <input id="apiBaseUrl" placeholder="https://ai-journal-nmo9.onrender.com" />
      </label>
      <label>
        手帐应用地址
        <input id="appUrl" placeholder="https://ai-journal-nmo9.onrender.com" />
      </label>
      <label>
        Prompt 模板
        <textarea id="promptTemplate" rows="16"></textarea>
      </label>
      <div class="actions">
        <button id="restore">恢复默认</button>
        <button id="save">保存设置</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
